name: WhatsApp Birthday Countdown

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  send_countdown:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate Days and Send WhatsApp Message
        env:
          META_ACCESS_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          PHONE_NUMBER_ID: ${{ secrets.PHONE_NUMBER_ID }}
          RECIPIENT_NUMBER: ${{ secrets.RECIPIENT_PHONE }}
        run: |
          TARGET_DATE="2026-10-14"
          CURRENT_DATE=$(date +%Y-%m-%d)
          DAYS_LEFT=$(( ($(date -d "$TARGET_DATE" +%s) - $(date -d "$CURRENT_DATE" +%s)) / 86400 ))

          echo "Days left: $DAYS_LEFT"

          if [ "$DAYS_LEFT" -gt 0 ]; then
            curl -sS --fail-with-body \
              -w "\nHTTP status: %{http_code}\n" \
              -X POST \
              "https://graph.facebook.com/v20.0/${PHONE_NUMBER_ID}/messages" \
              -H "Authorization: Bearer ${META_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{
                "messaging_product": "whatsapp",
                "to": "'"${RECIPIENT_NUMBER}"'",
                "type": "template",
                "template": {
                  "name": "bday_countdown",
                  "language": { "code": "en" },
                  "components": [
                    {
                      "type": "body",
                      "parameters": [
                        { "type": "text", "text": "'"${DAYS_LEFT}"'" }
                      ]
                    }
                  ]
                }
              }'
          elif [ "$DAYS_LEFT" -eq 0 ]; then
            echo "Today is the birthday!"
          else
            echo "Birthday has passed."
          fi
